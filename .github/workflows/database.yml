name: Database

on:
  pull_request:
    paths:
      - "drizzle/**"
      - "drizzle.config.ts"
      - "libs/backend/**"
      - "apps/api-dev/**"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d rustic"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rustic
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rustic
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rustic?application_name=integration
      SESSION_SECRET: test-session-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm exec nx test wallet
      - run: pnpm exec nx test orders
