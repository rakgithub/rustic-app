name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx format:check --base=origin/${{ github.event.repository.default_branch }} --head=HEAD
      - run: pnpm exec nx affected -t lint --parallel=3 --base=origin/${{ github.event.repository.default_branch }} --head=HEAD

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/scripts/typecheck.mjs

  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx affected -t test --parallel=3 --base=origin/${{ github.event.repository.default_branch }} --head=HEAD

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx affected -t build --parallel=3 --base=origin/${{ github.event.repository.default_branch }} --head=HEAD
      - run: pnpm exec nx affected -t federation-smoke --base=origin/${{ github.event.repository.default_branch }} --head=HEAD

  design-system:
    name: design system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:build
      - run: git diff --exit-code -- libs/shared/design-tokens/src/generated
      - run: pnpm exec storybook build --config-dir libs/shared/ui/.storybook --output-dir /tmp/rustic-ui-storybook

  performance:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t build -p shell account commerce --parallel=3
      - run: pnpm run bundle:check
